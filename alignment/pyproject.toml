[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcv-align"
version = "0.1.0"
description = "Pose graph + loop closure sidecar for point-cloud-visualizer session logs"
requires-python = ">=3.10"
dependencies = [
  "open3d>=0.18",
  "numpy>=1.26",
  "websockets>=14,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
pcv-align = "pcv_align.cli:main"
pcv-align-demo = "pcv_align.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcv_align*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
